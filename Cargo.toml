[package]
name = "fakefont"
version = "0.1.0"
edition = "2024"

[dependencies]
flate2 = "1.1.10"
fontdrasil = "1.0.0"
getrandom = "0.4.3"
google-fonts-glyphsets = { version = "1.1.3", git = "https://github.com/googlefonts/glyphsets" }
indexmap = "2.14.2"
rand = "0.10.2"
serde_json = "1.0.151"
skrifa = "0.47.0"
babelfont = { git = "https://github.com/simoncozens/babelfont-rs", package = "babelfont" }
fontmerge = { git = "https://github.com/simoncozens/babelfont-rs", package = "fontmerge" }

[workspace]
members = ["fakefont-web"]
resolver = "3"
# Plain `cargo build` / `cargo test` at the root stay native-only; the wasm
# crate is built explicitly with wasm-pack.
default-members = ["."]
